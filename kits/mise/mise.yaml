# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: mise
description: >-
  mise-en-place, installed as a pinned static musl binary from GitHub
  releases. Does not ship a mise.toml itself, but runs `mise install` on
  every boot so the workspace's own config (if any) is honored automatically.
sourceUrl: https://github.com/jdx/mise
licenses: [MIT]

kind: mixin

# One value drives the install, the provide, the published version and the
# tag.
version: "${{ kit.args.version }}"

args:
  version:
    default: "2026.9.16"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: mise release to install
    buildArg: MISE_VERSION

provides: ["mise@${{ kit.args.version }}"]

# No requires: the overlay ships a self-contained static musl binary and
# needs nothing from the composed base's package manager or libc, so it
# runs unmodified on a Debian, Alpine or distroless workload alike.

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # mise's own self-update, plus the GitHub-backed backends (core,
          # aqua, ubi, asdf, vfox) that most tool installs resolve through:
          # release asset downloads, source tarballs, and the redirect
          # hosts those land on.
          - github.com:443
          - api.github.com:443
          - codeload.github.com:443
          - objects.githubusercontent.com:443
          - release-assets.githubusercontent.com:443
          - raw.githubusercontent.com:443
          # mise's registry/shorthand index and version metadata service.
          - mise.jdx.dev:443
        # Deliberately not exhaustive: mise is a router to whichever
        # upstream registry a given tool's backend names (npm, PyPI,
        # crates.io, RubyGems, the Go proxy, arbitrary plugin git hosts,
        # direct URLs, …). See mise-context.md for how to extend this.

  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        # mise install is a no-op when nothing is configured (verified:
        # exits 0 with "mise all tools are installed" against an empty
        # workspace) and idempotent against an unchanged one, so this is
        # safe to run on every boot rather than gated to install-once.
        # Proxy vars are declared for the package-manager backends (npm,
        # pip, cargo, go, gem) that shell out to a child process needing
        # them; the hook's own GitHub egress is already covered under this
        # kit's runtime network-policy above.
        - command: [mise, install]
          env: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY, http_proxy, https_proxy, no_proxy]
          background: false
          description: Install the tools the workspace's mise config declares

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./mise-context.md
